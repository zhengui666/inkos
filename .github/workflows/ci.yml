name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_call:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @actalk/inkos-studio exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:flows
      - run: pnpm --filter @actalk/inkos-studio test:e2e
      - run: node scripts/install-smoke.mjs
